name: Build dependencies and publish a release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-2022
    outputs:
      artifact-name: windows-package
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Windows build
        run: buildWindows.bat x86
        shell: cmd

      - name: Package Windows outputs
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "bzflag-deps-windows-$tag.zip"
          Remove-Item $zip -ErrorAction SilentlyContinue
          Compress-Archive -Path licenses, windows-* -DestinationPath $zip -Force
          Write-Host "PACKAGE_PATH=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Upload Windows package artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-package
          path: bzflag-deps-windows-${{ github.ref_name }}.zip

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    outputs:
      artifact-name: macos-package
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run macOS build
        run: ./buildmacOS.sh

      - name: Package macOS outputs
        run: |
          TAG=${{ github.ref_name }}
          TAR="bzflag-deps-macOS-$TAG.tar.gz"
          rm -f "$TAR"
          tar -czf "$TAR" licenses macOS-*
          echo "TAR_PATH=$TAR"
      - name: Upload macOS package artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-package
          path: bzflag-deps-macOS-${{ github.ref_name }}.tar.gz

  publish-release:
    name: Create GitHub release and upload assets
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-macos
    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v8
        with:
          name: windows-package
          path: ./artifacts

      - name: Download macOS package
        uses: actions/download-artifact@v8
        with:
          name: macos-package
          path: ./artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          make_latest: true
          working_directory: artifacts
          files: |
            bzflag-deps-windows-${{ github.ref_name }}.zip
            bzflag-deps-macOS-${{ github.ref_name }}.tar.gz
