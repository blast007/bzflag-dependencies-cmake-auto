name: CI Build

on:
  #push:
  #  branches:
  #    - master
  #  paths-ignore:
  #    - 'README.md'
  #pull_request:
  #  branches:
  #    - master
  #  paths-ignore:
  #    - 'README.md'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Windows build
        run: buildWindows.bat
        shell: cmd

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run macOS build
        run: ./buildmacOS.sh
